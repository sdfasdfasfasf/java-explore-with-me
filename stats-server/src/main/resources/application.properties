server.port=9090
spring.application.name=stats-server
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stats}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:stats_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:stats_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.ru.practicum.ewm=DEBUG
logging.level.org.springframework.web=INFO